services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aplikacija
    ports:
      - "3307:3306"
    

  backend:
    build: ./backend
    volumes:
      - ./backend:/var/www
    depends_on:
      - db
    ports:
      - "8000:8000"
   

  frontend:
    build: ./frontend/reactkarton
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/reactkarton:/app
      - /app/node_modules

